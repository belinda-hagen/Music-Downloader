<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Downloader Mini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* The window is transparent; .shell draws the visible shape of each style. */
    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    /* For the Size setting the window is enlarged by --ui-scale; the page is
       laid out at its normal size and scaled up to fill it. */
    body {
      --ui-scale: 1;
      width: calc(100vw / var(--ui-scale));
      height: calc(100vh / var(--ui-scale));
      scale: var(--ui-scale);
      transform-origin: 0 0;
    }

    body {
      --accent: #e83f79;
      --accent-glow: rgba(232, 63, 121, 0.5);
      --text: #fff;
      --text-muted: rgba(255, 255, 255, 0.68);
      --text-dim: rgba(255, 255, 255, 0.5);
      --hairline: rgba(255, 255, 255, 0.12);
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --progress: 0;
      --art-size: 64px;
      --art-radius: 8px;
      color: var(--text);
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: grab;
    }

    body.dragging {
      cursor: grabbing;
    }

    body[data-theme="ocean"] {
      --accent: #21b6a8;
      --accent-glow: rgba(33, 182, 168, 0.5);
    }

    body[data-theme="ember"] {
      --accent: #e86f22;
      --accent-glow: rgba(232, 111, 34, 0.5);
    }

    body[data-theme="violet"] {
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.5);
    }

    /* ── Shell and ambient backdrop ──────────────────────────────── */
    .shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      border-radius: 14px;
      background: #111113;
      animation: shell-in 220ms var(--ease) both;
    }

    /* Hairline edge drawn above everything, so artwork never hides it. */
    .shell::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 10;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px var(--hairline), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    @keyframes shell-in {
      from { opacity: 0; transform: scale(0.97); }
    }

    /* The song's artwork, blurred, tints every style. Without artwork it
       falls back to a soft glow in the theme color. */
    .mini-bg {
      position: absolute;
      inset: -30%;
      z-index: -2;
      background-color: #141416;
      background-image:
        radial-gradient(55% 75% at 20% 25%, var(--accent-glow), transparent 70%),
        radial-gradient(45% 65% at 85% 95%, rgba(255, 255, 255, 0.07), transparent 70%);
      background-position: center;
      background-size: cover;
      filter: blur(28px) saturate(1.6);
      transition: transform 700ms var(--ease);
    }

    .mini-scrim {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(12, 12, 14, 0.52) 0%, rgba(12, 12, 14, 0.74) 100%);
      transition: background 240ms var(--ease);
    }

    .mini-player {
      position: relative;
      height: 100%;
      display: grid;
      align-items: center;
    }

    /* ── Artwork ─────────────────────────────────────────────────── */
    .art {
      grid-area: art;
      position: relative;
      width: var(--art-size);
      height: var(--art-size);
    }

    .art-frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: var(--art-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.85);
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 70%, #111) 0%, #1d1d21 100%);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .art-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      pointer-events: none;
    }

    body.has-art .art-frame img {
      display: block;
    }

    body.has-art .art-placeholder {
      display: none;
    }

    .art-placeholder {
      width: 42%;
      height: 42%;
    }

    /* Hovering the artwork offers to open the main window. */
    .art-expand {
      position: absolute;
      inset: 0;
      border: 0;
      border-radius: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      cursor: pointer;
      opacity: 0;
      transition: opacity 160ms var(--ease);
    }

    .art:hover .art-expand,
    .art-expand:focus-visible {
      opacity: 1;
    }

    .art-ring {
      display: none;
    }

    /* ── Title and artist ────────────────────────────────────────── */
    .meta {
      grid-area: meta;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .title-row {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .title {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.005em;
    }

    .title span {
      display: inline-block;
    }

    /* Long titles fade out at the edge and scroll while hovered. */
    .title.overflowing {
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent);
    }

    .shell:hover .title.overflowing span {
      animation: marquee var(--marquee-duration, 6s) linear 500ms infinite alternate;
    }

    @keyframes marquee {
      0%, 12% { transform: translateX(0); }
      88%, 100% { transform: translateX(calc(var(--marquee-distance, 0px) * -1)); }
    }

    .artist {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .artist:empty {
      display: none;
    }

    .eq {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
      flex-shrink: 0;
    }

    body.playing .eq {
      display: inline-flex;
    }

    .eq span {
      width: 2.5px;
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      transform-origin: bottom;
      animation: eq 900ms ease-in-out infinite alternate;
    }

    .eq span:nth-child(2) { animation-duration: 640ms; animation-delay: -300ms; }
    .eq span:nth-child(3) { animation-duration: 780ms; animation-delay: -520ms; }

    @keyframes eq {
      0% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
      100% { transform: scaleY(0.45); }
    }

    /* ── Timeline (seekable) ─────────────────────────────────────── */
    .timeline {
      grid-area: timeline;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }

    .time {
      display: none;
      min-width: 28px;
    }

    .time.end {
      text-align: right;
    }

    .seek {
      flex: 1;
      height: 14px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .seek-track {
      position: relative;
      width: 100%;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.18);
      transition: height 140ms var(--ease);
    }

    .seek-fill {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.92);
      transform: scaleX(calc(var(--progress) / 100));
      transform-origin: left;
      transition: transform 260ms linear, background 140ms var(--ease);
    }

    .seek-knob {
      position: absolute;
      top: 50%;
      left: calc(var(--progress) * 1%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      transform: translate(-50%, -50%) scale(0);
      transition: left 260ms linear, transform 140ms var(--ease);
    }

    .seek:hover .seek-track,
    body.seeking .seek-track {
      height: 4px;
    }

    .seek:hover .seek-fill,
    body.seeking .seek-fill {
      background: var(--accent);
    }

    .seek:hover .seek-knob,
    body.seeking .seek-knob {
      transform: translate(-50%, -50%) scale(1);
    }

    body.seeking .seek-fill,
    body.seeking .seek-knob {
      transition: none;
    }

    /* ── Controls ────────────────────────────────────────────────── */
    .controls {
      grid-area: controls;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn {
      position: relative;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.78);
      background: transparent;
      cursor: pointer;
      transition: background 160ms var(--ease), color 160ms var(--ease), transform 160ms var(--ease), opacity 160ms var(--ease), width 200ms var(--ease);
    }

    .btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn:focus-visible,
    .art-expand:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .btn.play {
      width: 36px;
      height: 36px;
      color: #0b0b0c;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .btn.play:hover {
      color: #0b0b0c;
      background: #fff;
      transform: scale(1.06);
    }

    .btn.play:active {
      transform: scale(0.95);
    }

    .icon-pause,
    body.playing .icon-play {
      display: none;
    }

    body.playing .icon-pause {
      display: block;
    }

    .btn.toggle {
      display: none;
      color: rgba(255, 255, 255, 0.55);
    }

    .btn.toggle.active {
      color: var(--accent);
    }

    .btn.toggle.active::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
      transform: translateX(-50%);
    }

    .repeat-one {
      display: none;
      position: absolute;
      top: 3px;
      right: 2px;
      min-width: 11px;
      height: 11px;
      padding: 0 2px;
      border-radius: 6px;
      font-size: 8px;
      font-weight: 700;
      line-height: 11px;
      color: #0b0b0c;
      background: var(--accent);
    }

    body[data-repeat="one"] .repeat-one {
      display: block;
    }

    /* ── Window actions (open app, close) ───────────────────────── */
    .win-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 6;
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 160ms var(--ease);
    }

    .shell:hover .win-actions,
    .win-actions:focus-within {
      opacity: 1;
    }

    .win-actions .btn {
      width: 20px;
      height: 20px;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.32);
    }

    .win-actions .btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.16);
    }

    .win-actions .btn.close:hover {
      background: #f15e6c;
    }

    /* ── Classic: artwork card with a seek bar ───────────────────── */
    body[data-style="classic"] {
      --art-size: 60px;
    }

    body[data-style="classic"] .mini-player {
      grid-template-columns: var(--art-size) minmax(0, 1fr) auto;
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas:
        "art meta controls"
        "art timeline timeline";
      column-gap: 13px;
      row-gap: 2px;
      padding: 14px 14px 14px 14px;
    }

    body[data-style="classic"] .art {
      align-self: center;
    }

    body[data-style="classic"] .meta {
      align-self: end;
      padding-bottom: 2px;
    }

    body[data-style="classic"] .controls {
      align-self: end;
      gap: 2px;
      margin-right: -4px;
    }

    body[data-style="classic"] .timeline {
      align-self: start;
      margin-bottom: -4px;
    }

    body[data-style="classic"] #btn-win-expand {
      display: none;
    }

    body[data-style="classic"] .win-actions {
      top: 5px;
      right: 5px;
    }

    body[data-style="classic"] .win-actions .btn {
      width: 17px;
      height: 17px;
    }

    /* ── Compact: a slim pill with a progress ring ───────────────── */
    body[data-style="compact"] {
      --art-size: 40px;
      --art-radius: 50%;
    }

    body[data-style="compact"] .shell {
      border-radius: 999px;
    }

    body[data-style="compact"] .mini-player {
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      grid-template-areas: "art meta controls actions";
      column-gap: 10px;
      padding: 0 10px 0 5px;
    }

    body[data-style="compact"] .art {
      width: calc(var(--art-size) + 10px);
      height: calc(var(--art-size) + 10px);
      padding: 5px;
    }

    body[data-style="compact"] .art-frame {
      box-shadow: none;
    }

    body[data-style="compact"] .art-ring {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .ring-track,
    .ring-fill {
      fill: none;
      stroke-width: 1.9;
    }

    .ring-track {
      stroke: rgba(255, 255, 255, 0.14);
    }

    .ring-fill {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 100px 100px;
      stroke-dashoffset: calc((100 - var(--progress)) * 1px);
      transition: stroke-dashoffset 260ms linear;
    }

    body[data-style="compact"] .art-placeholder {
      width: 50%;
      height: 50%;
    }

    body[data-style="compact"] .title {
      font-size: 13px;
    }

    body[data-style="compact"] .artist {
      font-size: 11.5px;
    }

    body[data-style="compact"] .meta {
      gap: 1px;
    }

    body[data-style="compact"] .eq,
    body[data-style="compact"] .timeline,
    body[data-style="compact"] #btn-prev,
    body[data-style="compact"] .art-expand {
      display: none;
    }

    body[data-style="compact"] .controls {
      gap: 0;
    }

    body[data-style="compact"] .btn.play {
      width: 36px;
      height: 36px;
      box-shadow: none;
    }

    /* The window buttons take no room until the pill is hovered. */
    body[data-style="compact"] .win-actions {
      grid-area: actions;
      position: static;
      gap: 0;
      margin-left: -10px;
      opacity: 1;
      transition: margin 200ms var(--ease);
    }

    body[data-style="compact"] .shell:hover .win-actions,
    body[data-style="compact"] .win-actions:focus-within {
      margin-left: -6px;
    }

    body[data-style="compact"] .win-actions .btn {
      width: 0;
      height: 22px;
      opacity: 0;
      background: transparent;
      overflow: hidden;
    }

    body[data-style="compact"] .shell:hover .win-actions .btn,
    body[data-style="compact"] .win-actions:focus-within .btn {
      width: 22px;
      opacity: 1;
    }

    body[data-style="compact"] .win-actions .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    body[data-style="compact"] .win-actions .btn.close:hover {
      background: #f15e6c;
    }

    /* ── Cover: full-bleed artwork, controls on hover ───────────── */
    body[data-style="cover"] .shell {
      border-radius: 16px;
    }

    body[data-style="cover"] .mini-bg {
      inset: 0;
      filter: none;
    }

    body[data-style="cover"].has-art .shell:hover .mini-bg {
      transform: scale(1.05);
    }

    body[data-style="cover"]:not(.has-art) .mini-bg {
      background-image:
        radial-gradient(90% 90% at 25% 15%, var(--accent-glow), transparent 70%),
        linear-gradient(160deg, #1e1e22, #0f0f11);
    }

    body[data-style="cover"] .mini-scrim {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.35) 58%, rgba(0, 0, 0, 0.86) 100%);
    }

    body[data-style="cover"] .shell:hover .mini-scrim,
    body[data-style="cover"]:not(.playing) .mini-scrim {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.45) 40%, rgba(0, 0, 0, 0.9) 100%);
    }

    body[data-style="cover"] .mini-player {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: stretch;
      padding: 14px 14px 18px;
    }

    /* Without artwork the frame becomes a large centered placeholder. */
    body[data-style="cover"] .art {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      transform: translate(-50%, -78%);
      pointer-events: none;
      transition: opacity 200ms var(--ease);
    }

    body[data-style="cover"] .art-expand {
      display: none;
    }

    body[data-style="cover"] .art-frame {
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.6);
    }

    body[data-style="cover"].has-art .art,
    body[data-style="cover"] .shell:hover .art,
    body[data-style="cover"]:not(.playing) .art {
      opacity: 0;
    }

    body[data-style="cover"] .meta {
      gap: 4px;
    }

    body[data-style="cover"] .title {
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
    }

    body[data-style="cover"] .artist {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.78);
    }

    body[data-style="cover"] .controls {
      position: absolute;
      top: 50%;
      left: 50%;
      gap: 10px;
      opacity: 0;
      transform: translate(-50%, -60%) scale(0.94);
      transition: opacity 200ms var(--ease), transform 240ms var(--ease);
    }

    body[data-style="cover"] .shell:hover .controls,
    body[data-style="cover"]:not(.playing) .controls,
    body[data-style="cover"] .controls:focus-within {
      opacity: 1;
      transform: translate(-50%, -70%) scale(1);
    }

    body[data-style="cover"] .btn:not(.play) {
      width: 34px;
      height: 34px;
      color: #fff;
      background: rgba(0, 0, 0, 0.35);
    }

    body[data-style="cover"] .btn:not(.play):hover {
      background: rgba(255, 255, 255, 0.18);
    }

    body[data-style="cover"] .btn.play {
      width: 46px;
      height: 46px;
    }

    body[data-style="cover"] .btn.play svg {
      width: 20px;
      height: 20px;
    }

    body[data-style="cover"] .timeline {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 3px;
    }

    body[data-style="cover"] .seek-track {
      background: rgba(255, 255, 255, 0.24);
    }

    body[data-style="cover"] .win-actions {
      top: 8px;
      right: 8px;
      gap: 4px;
    }

    body[data-style="cover"] .win-actions .btn {
      width: 22px;
      height: 22px;
      color: #fff;
      background: rgba(0, 0, 0, 0.42);
    }

    /* ── Glass (Extended): everything, with shuffle and repeat ─────── */
    body[data-style="glass"] {
      --art-size: 92px;
      --art-radius: 10px;
    }

    body[data-style="glass"] .shell {
      border-radius: 16px;
    }

    body[data-style="glass"] .mini-player {
      grid-template-columns: var(--art-size) minmax(0, 1fr);
      grid-template-rows: auto auto auto;
      grid-template-areas:
        "art meta"
        "art timeline"
        "art controls";
      align-content: center;
      column-gap: 14px;
      row-gap: 3px;
      padding: 12px 16px 12px 12px;
    }

    body[data-style="glass"] .meta {
      padding-right: 44px;
    }

    body[data-style="glass"] .title {
      font-size: 14px;
    }

    body[data-style="glass"] .timeline {
      margin-top: 2px;
    }

    body[data-style="glass"] .time {
      display: block;
    }

    body[data-style="glass"] .controls {
      justify-content: space-between;
      padding: 0 2px;
    }

    body[data-style="glass"] .btn.toggle {
      display: inline-flex;
    }

    body[data-style="glass"] .btn.play {
      width: 32px;
      height: 32px;
    }

    body[data-style="glass"] #btn-win-expand {
      display: none;
    }

    body[data-style="glass"] .win-actions {
      top: 8px;
      right: 8px;
    }

    /* ── Settings preview ────────────────────────────────────────── */
    body.preview,
    body.preview * {
      pointer-events: none;
      cursor: default;
      transition: none !important;
    }

    body.preview .shell {
      animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="mini-bg" id="mini-bg"></div>
    <div class="mini-scrim"></div>
    <div class="mini-player">
      <div class="art">
        <div class="art-frame">
          <img id="art-img" src="" alt="" draggable="false">
          <svg class="art-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          <button class="art-expand" id="btn-art-expand" title="Open Music Downloader" aria-label="Open Music Downloader">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
        </div>
        <!-- r = 100 / 2π, so the circumference is exactly 100 user units. -->
        <svg class="art-ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="ring-track" cx="18" cy="18" r="15.915"/>
          <circle class="ring-fill" cx="18" cy="18" r="15.915"/>
        </svg>
      </div>

      <div class="meta">
        <div class="title-row">
          <span class="eq" aria-hidden="true"><span></span><span></span><span></span></span>
          <div class="title" id="mini-title"><span>No song playing</span></div>
        </div>
        <div class="artist" id="mini-artist"></div>
      </div>

      <div class="timeline">
        <span class="time" id="time-current">0:00</span>
        <div class="seek" id="seek" title="Seek">
          <div class="seek-track">
            <div class="seek-fill"></div>
            <div class="seek-knob"></div>
          </div>
        </div>
        <span class="time end" id="time-duration">0:00</span>
      </div>

      <div class="controls">
        <button class="btn toggle" id="btn-shuffle" title="Shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="btn" id="btn-prev" title="Previous" aria-label="Previous">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18.4 4.6a1 1 0 0 1 1.6.8v13.2a1 1 0 0 1-1.6.8L9.6 12.8a1 1 0 0 1 0-1.6z"/><rect x="5" y="4" width="2.6" height="16" rx="1.3"/></svg>
        </button>
        <button class="btn play" id="btn-play" title="Play/Pause" aria-label="Play/Pause">
          <svg class="icon-play" viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M8 5.6v12.8a1.2 1.2 0 0 0 1.8 1l10.2-6.4a1.2 1.2 0 0 0 0-2L9.8 4.6A1.2 1.2 0 0 0 8 5.6z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.4"/><rect x="14" y="4.5" width="4" height="15" rx="1.4"/></svg>
        </button>
        <button class="btn" id="btn-next" title="Next" aria-label="Next">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M5.6 4.6A1 1 0 0 0 4 5.4v13.2a1 1 0 0 0 1.6.8l8.8-6.6a1 1 0 0 0 0-1.6z"/><rect x="16.4" y="4" width="2.6" height="16" rx="1.3"/></svg>
        </button>
        <button class="btn toggle" id="btn-repeat" title="Repeat: Off" aria-label="Repeat">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span class="repeat-one" aria-hidden="true">1</span>
        </button>
      </div>

      <div class="win-actions">
        <button class="btn" id="btn-win-expand" title="Open Music Downloader" aria-label="Open Music Downloader">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
        <button class="btn close" id="btn-close" title="Close mini player" aria-label="Close mini player">
          <svg viewBox="0 0 10 10" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1.5" y1="1.5" x2="8.5" y2="8.5"/><line x1="8.5" y1="1.5" x2="1.5" y2="8.5"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Loaded both as the floating mini player window (with node integration)
    // and as an <iframe> preview in Settings, which gets its data via postMessage.
    const ipcRenderer = typeof require === 'function' ? require('electron').ipcRenderer : null;
    const params = new URLSearchParams(location.search);
    const isPreview = params.has('preview') || !ipcRenderer;

    const els = {
      bg: document.getElementById('mini-bg'),
      title: document.getElementById('mini-title'),
      titleText: document.querySelector('#mini-title span'),
      artist: document.getElementById('mini-artist'),
      artImg: document.getElementById('art-img'),
      seek: document.getElementById('seek'),
      timeCurrent: document.getElementById('time-current'),
      timeDuration: document.getElementById('time-duration'),
      shuffle: document.getElementById('btn-shuffle'),
      repeat: document.getElementById('btn-repeat'),
    };

    const themes = new Set(['rose', 'ocean', 'ember', 'violet']);
    const styles = new Set(['classic', 'compact', 'cover', 'glass']);
    const repeatTitles = { none: 'Repeat: Off', all: 'Repeat: All', one: 'Repeat: One' };

    let duration = 0;
    let seeking = false;

    function applyTheme(theme) {
      document.body.dataset.theme = themes.has(theme) ? theme : 'rose';
    }

    function applyStyle(style) {
      document.body.dataset.style = styles.has(style) ? style : 'classic';
      updateMarquee();
    }

    function applyScale(scale) {
      const value = Number(scale);
      document.body.style.setProperty('--ui-scale', value > 0 ? value : 1);
    }

    function formatTime(seconds) {
      if (!seconds || !isFinite(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function setProgress(percent) {
      document.body.style.setProperty('--progress', Math.min(Math.max(percent, 0), 100));
    }

    // Titles too long for their row scroll on hover, at a steady reading speed.
    function updateMarquee() {
      const distance = els.titleText.scrollWidth - els.title.clientWidth;
      const overflowing = distance > 2;
      els.title.classList.toggle('overflowing', overflowing);
      if (overflowing) {
        els.title.style.setProperty('--marquee-distance', `${distance + 22}px`);
        els.title.style.setProperty('--marquee-duration', `${Math.max(3, (distance + 22) / 28)}s`);
      }
    }

    new ResizeObserver(updateMarquee).observe(els.title);

    function update(data) {
      if (data.scale !== undefined) applyScale(data.scale);
      if (data.theme !== undefined) applyTheme(data.theme);
      if (data.style !== undefined) applyStyle(data.style);
      if (data.title && data.title !== els.titleText.textContent) {
        els.titleText.textContent = data.title;
        els.title.title = data.title;
        updateMarquee();
      }
      if (data.channel !== undefined) els.artist.textContent = data.channel;
      if (data.thumbnail !== undefined) {
        if (data.thumbnail) {
          els.artImg.src = data.thumbnail;
          const url = data.thumbnail.replace(/\\/g, '/').replace(/"/g, '%22');
          els.bg.style.backgroundImage = `url("${url}")`;
        } else {
          els.artImg.removeAttribute('src');
          els.bg.style.backgroundImage = '';
        }
        document.body.classList.toggle('has-art', !!data.thumbnail);
      }
      if (data.isPlaying !== undefined) {
        document.body.classList.toggle('playing', data.isPlaying);
      }
      if (data.duration !== undefined) {
        duration = data.duration;
        els.timeDuration.textContent = formatTime(duration);
      }
      // While the seek bar is held, the bar follows the pointer, not playback.
      if (!seeking) {
        if (data.progress !== undefined) setProgress(data.progress);
        if (data.currentTime !== undefined) els.timeCurrent.textContent = formatTime(data.currentTime);
      }
      if (data.shuffle !== undefined) {
        els.shuffle.classList.toggle('active', data.shuffle);
        els.shuffle.title = data.shuffle ? 'Shuffle: On' : 'Shuffle: Off';
      }
      if (data.repeat !== undefined) {
        const mode = repeatTitles[data.repeat] ? data.repeat : 'none';
        document.body.dataset.repeat = mode;
        els.repeat.classList.toggle('active', mode !== 'none');
        els.repeat.title = repeatTitles[mode];
      }
    }

    applyStyle(params.get('style'));
    if (!isPreview) applyScale(params.get('scale'));

    if (isPreview) {
      document.body.classList.add('preview');
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'mini-preview') update(e.data.state);
      });
    } else {
      ipcRenderer.on('mini-player-update', (event, data) => update(data));

      const send = (command, value) => ipcRenderer.send('mini-player-command', command, value);
      document.getElementById('btn-play').addEventListener('click', () => send('toggle-play'));
      document.getElementById('btn-prev').addEventListener('click', () => send('prev'));
      document.getElementById('btn-next').addEventListener('click', () => send('next'));
      document.getElementById('btn-shuffle').addEventListener('click', () => send('shuffle'));
      document.getElementById('btn-repeat').addEventListener('click', () => send('repeat'));
      document.getElementById('btn-close').addEventListener('click', () => send('close'));
      document.getElementById('btn-win-expand').addEventListener('click', () => send('restore'));
      document.getElementById('btn-art-expand').addEventListener('click', () => send('restore'));
      document.body.addEventListener('dblclick', (e) => {
        if (!e.target.closest('button, .seek')) send('restore');
      });

      // Seeking: the bar tracks the pointer and the new position is sent on release.
      let seekFraction = 0;
      const seekTo = (e) => {
        const rect = els.seek.getBoundingClientRect();
        seekFraction = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        setProgress(seekFraction * 100);
        els.timeCurrent.textContent = formatTime(seekFraction * duration);
      };
      els.seek.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !duration) return;
        e.stopPropagation();
        seeking = true;
        els.seek.setPointerCapture(e.pointerId);
        document.body.classList.add('seeking');
        seekTo(e);
      });
      els.seek.addEventListener('pointermove', (e) => {
        if (seeking) seekTo(e);
      });
      const endSeek = (commit) => {
        if (!seeking) return;
        seeking = false;
        document.body.classList.remove('seeking');
        if (commit) send('seek', seekFraction);
      };
      els.seek.addEventListener('pointerup', () => endSeek(true));
      els.seek.addEventListener('pointercancel', () => endSeek(false));

      let drag = null;
      let frame = 0;
      document.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || e.target.closest('button, .seek')) return;
        drag = { x: e.screenX, y: e.screenY, dx: 0, dy: 0 };
        document.body.setPointerCapture(e.pointerId);
        document.body.classList.add('dragging');
        ipcRenderer.send('mini-player-drag', 'start');
      });
      document.addEventListener('pointermove', (e) => {
        if (!drag) return;
        drag.dx = e.screenX - drag.x;
        drag.dy = e.screenY - drag.y;
        if (frame) return;
        frame = requestAnimationFrame(() => {
          frame = 0;
          if (drag) ipcRenderer.send('mini-player-drag', 'move', drag.dx, drag.dy);
        });
      });
      const endDrag = () => {
        if (!drag) return;
        drag = null;
        document.body.classList.remove('dragging');
        ipcRenderer.send('mini-player-drag', 'end');
      };
      document.addEventListener('pointerup', endDrag);
      document.addEventListener('pointercancel', endDrag);
    }
  </script>
</body>
</html>
